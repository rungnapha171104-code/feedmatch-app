<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าร่วมห้อง - FeedMatch</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Noto Sans Thai', 'Inter', sans-serif; }
    </style>
    <link rel="icon" type="image/png" href="../assets/images/Logoremovebg.png">
</head>
<body class="min-h-screen bg-gray-50 flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center z-50 w-full shrink-0">
        <!-- Left: Logo -->
        <div class="flex items-center">
            <img src="../assets/images/Logoremovebg.png" alt="FeedMatch Logo" class="h-16 w-auto object-contain">
        </div>
        
        <!-- Right: Cancel -->
        <a href="../room/main.html" class="text-sm font-medium text-gray-400 hover:text-red-500 transition-colors flex items-center gap-2">
            <i class="ph ph-x text-lg"></i>
            ยกเลิก
        </a>
    </header>

    <!-- Main Content -->
    <main class="max-w-xl mx-auto w-full px-6 flex-grow flex flex-col items-center justify-center text-center pb-20">
        
        <!-- Icon -->
        <div class="text-orange-500 bg-orange-100/50 p-5 rounded-full mb-2">
            <i class="ph-fill ph-users-three text-5xl drop-shadow-sm"></i>
        </div>

        <!-- Headers -->
        <h1 class="text-3xl font-bold text-gray-800 mt-4 tracking-tight">เข้าร่วมห้อง</h1>
        <p class="text-gray-500 mt-2 font-light">กรอกรหัสห้องที่คุณได้รับจากเพื่อน</p>

        <!-- Room Code Input -->
        <input 
            type="text" 
            id="room-code-input" 
            placeholder="FM-XXXXXX" 
            maxlength="9" 
            class="w-full max-w-sm mt-8 text-center text-3xl font-bold tracking-widest uppercase bg-white border-2 border-gray-200 rounded-2xl py-4 focus:outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-100 transition-all placeholder-gray-300 shadow-sm"
            autocomplete="off"
            oninput="this.value = this.value.toUpperCase()"
        >

        <!-- Primary Action Button -->
        <button id="joinRoomBtn" class="flex justify-center items-center gap-2 w-full max-w-sm mt-6 bg-orange-500 text-white font-medium text-lg py-4 rounded-full shadow-[0_8px_20px_-6px_rgba(249,115,22,0.5)] hover:shadow-xl hover:shadow-orange-500/40 hover:-translate-y-0.5 hover:bg-orange-600 transition-all">
            เข้าร่วมเลย
            <i class="ph-bold ph-arrow-right"></i>
        </button>

        <!-- Divider -->
        <div class="flex items-center gap-4 mt-8 w-full max-w-sm opacity-60">
            <div class="h-px bg-gray-300 flex-grow"></div>
            <span class="text-gray-400 text-sm font-medium">หรือ</span>
            <div class="h-px bg-gray-300 flex-grow"></div>
        </div>

        <!-- Secondary Action -->
        <a href="scan_qr.html" class="text-orange-500 hover:text-orange-600 font-medium mt-6 flex items-center gap-2 transition-colors hover:bg-orange-50 px-6 py-2 rounded-full">
            <i class="ph-bold ph-qr-code text-xl"></i>
            สแกนคิวอาร์โค้ด
        </a>

    </main>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = '../index.html';
            return;
        }

        const user = session.user;
        const displayName = user.user_metadata?.display_name || 'User';
        // Sync user to public.users table to ensure they exist for foreign keys
        await supabaseClient.from('users').upsert({ id: user.id, display_name: displayName });

        // Auto-populate from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        if (code) {
            document.getElementById('room-code-input').value = code;
            // Auto join if code is provided in URL (e.g. from scanning QR)
            setTimeout(() => {
                document.getElementById('joinRoomBtn').click();
            }, 300);
        }
    });

    document.getElementById('joinRoomBtn').addEventListener('click', async () => {
        const roomCode = document.getElementById('room-code-input').value.trim().toUpperCase();
        
        if (!roomCode) {
            alert('กรุณากรอกรหัสห้อง');
            return;
        }

        const btn = document.getElementById('joinRoomBtn');
        const originalHtml = btn.innerHTML;
        btn.innerHTML = 'กำลังเข้าร่วม...';
        btn.disabled = true;

        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) return;
        const userId = session.user.id;

        // Check if room exists
        const { data: roomData, error: roomError } = await supabaseClient
            .from('rooms')
            .select('id, status')
            .eq('room_code', roomCode)
            .single();

        if (roomError || !roomData) {
            alert('ไม่พบห้องนี้ หรือรหัสห้องไม่ถูกต้อง');
            btn.innerHTML = originalHtml;
            btn.disabled = false;
            return;
        }

        // Insert user into room_members
        // We use upsert or handle unique constraint violation gently if they already joined
        const { error: memberError } = await supabaseClient
            .from('room_members')
            .upsert([{ room_id: roomData.id, user_id: userId, is_ready: false }]);

        if (memberError) {
            alert('เกิดข้อผิดพลาดในการเข้าร่วมห้อง: ' + memberError.message);
            btn.innerHTML = originalHtml;
            btn.disabled = false;
            return;
        }

        // Redirect to lobby
        window.location.href = `lobby.html?id=${roomData.id}`;
    });
</script>
</body>
</html>
