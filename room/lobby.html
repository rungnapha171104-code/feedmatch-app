<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ห้องรอ - FeedMatch</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Noto Sans Thai', 'Inter', sans-serif; }
    </style>
    <link rel="icon" type="image/png" href="../assets/images/Logoremovebg.png">
</head>
<body class="min-h-screen bg-gray-50 flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center z-50 w-full shrink-0">
        <!-- Left: Logo -->
        <div class="flex items-center">
            <img src="../assets/images/Logoremovebg.png" alt="FeedMatch Logo" class="h-16 w-auto object-contain">
        </div>
        
        <!-- Right: Leave Room -->
        <button id="leaveRoomBtn" class="text-sm font-medium text-gray-400 hover:text-red-500 transition-colors flex items-center gap-2">
            <i class="ph ph-sign-out text-lg"></i>
            ออกจากห้อง
        </button>
    </header>

    <!-- Main Content (Centered & Minimal) -->
    <main class="max-w-3xl mx-auto w-full px-6 py-12 flex flex-col items-center text-center flex-grow">
        
        <!-- Headers -->
        <h1 class="text-3xl font-semibold text-gray-800 mb-2 tracking-tight">ชวนเพื่อนมาร่วมวง</h1>
        <p class="text-gray-400 font-light mb-12">สแกนคิวอาร์โค้ด หรือแชร์รหัสห้องเพื่อเข้าร่วมปัด</p>

        <!-- Dynamic Room Code & QR Section -->
        <div class="bg-white p-10 rounded-[2rem] shadow-sm border border-gray-100 flex flex-col items-center w-full max-w-md mb-12">
            <!-- QR Code -->
            <div class="p-2 border border-gray-100 rounded-2xl mb-6 bg-white shadow-sm">
                <img id="qr-code-img" src="" alt="Room QR Code" class="w-40 h-40 object-cover opacity-90">
            </div>

            <!-- Room Code -->
            <p class="text-sm text-gray-400 font-medium uppercase tracking-widest mb-2">รหัสห้องของคุณ</p>
            <div id="room-code-display" class="text-5xl font-bold text-orange-500 tracking-widest mb-6">
                FM-XXXX
            </div>

            <!-- Copy Button -->
            <button onclick="copyLink()" class="flex items-center gap-2 text-gray-400 hover:text-orange-500 font-medium text-sm transition-colors px-5 py-2.5 rounded-full border border-transparent hover:bg-orange-50 hover:border-orange-100">
                <i class="ph ph-copy text-lg"></i>
                คัดลอกลิงก์
            </button>
        </div>

        <!-- Friends List (Minimalist Avatars) -->
        <div class="flex flex-col items-center w-full">
            <p id="member-count" class="text-sm text-gray-400 uppercase tracking-widest mb-6 font-medium">เพื่อนที่เข้าร่วม (1/10)</p>
            
            <div id="members-list" class="flex flex-row justify-center items-center -space-x-4 mb-8">
                <!-- Members will be injected here via JS -->
            </div>
        </div>

        <!-- Action Button -->
        <button id="startBtn" class="hidden inline-flex items-center gap-3 bg-orange-500 text-white font-medium text-lg px-12 py-4 rounded-full shadow-[0_8px_20px_-6px_rgba(249,115,22,0.5)] hover:shadow-xl hover:shadow-orange-500/40 hover:-translate-y-0.5 hover:bg-orange-600 transition-all mt-6">
            เริ่มสไลด์เลย!
            <i class="ph-bold ph-arrow-right"></i>
        </button>
        <p id="waitingMessage" class="hidden text-gray-500 font-medium mt-6">รอโฮสต์เริ่มเกม...</p>

    </main>

<!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('id');

        if (!roomId) {
            alert('ไม่พบรหัสห้อง');
            window.location.href = 'main.html';
        }

        let currentUser = null;
        let isHost = false;
        let roomCode = '';
        let isIntentionalNavigation = false;

        // Aggressive deletion on pagehide removed to prevent dropping rooms on mobile tab switch

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = '../index.html';
                return;
            }
            currentUser = session.user;
            window.currentUserToken = session.access_token;

            // Sync user to public.users table to ensure they have a display name for others to see
            const displayName = currentUser.user_metadata?.display_name || 'User';
            await supabaseClient.from('users').upsert({ id: currentUser.id, display_name: displayName });

            // Fetch Room Details
            const { data: roomData, error: roomError } = await supabaseClient
                .from('rooms')
                .select('*')
                .eq('id', roomId)
                .single();

            if (roomError || !roomData) {
                alert('ห้องนี้ไม่มีอยู่จริง หรือถูกปิดไปแล้ว');
                window.location.href = 'main.html';
                return;
            }

            roomCode = roomData.room_code;
            isHost = (roomData.host_id === currentUser.id);

            // Display Room Code and QR
            document.getElementById('room-code-display').textContent = roomCode;
            const joinUrl = window.location.origin + '/room/join.html?code=' + roomCode;
            document.getElementById('qr-code-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(joinUrl)}`;

            // Check if room is already started
            if (roomData.status === 'swiping') {
                window.location.href = `../play/swipe.html?id=${roomId}`;
            }

            // Show Start Button or Waiting Message
            if (isHost) {
                document.getElementById('startBtn').classList.remove('hidden');
            } else {
                document.getElementById('waitingMessage').classList.remove('hidden');
            }

            // Fetch Members
            fetchAndRenderMembers();

            // Realtime subscriptions
            setupRealtime();
        });

        async function fetchAndRenderMembers() {
            const { data: members, error } = await supabaseClient
                .from('room_members')
                .select('user_id, is_ready, users ( display_name )')
                .eq('room_id', roomId);

            if (error) {
                console.error('Error fetching members:', error);
                return;
            }

            // Fetch profiles for these members
            const userIds = members.map(m => m.user_id);
            const { data: profiles, error: profileError } = await supabaseClient
                .from('profiles')
                .select('id, avatar_url, avatar_color, username')
                .in('id', userIds);
                
            const profileMap = {};
            if (!profileError && profiles) {
                profiles.forEach(p => {
                    profileMap[p.id] = p;
                });
            }

            const membersList = document.getElementById('members-list');
            membersList.innerHTML = '';
            
            document.getElementById('member-count').textContent = `เพื่อนที่เข้าร่วม (${members.length}/10)`;

            members.forEach((member, index) => {
                const name = member.users?.display_name || 'Unknown';
                const initial = name.substring(0, 2).toUpperCase();
                const zIndex = 10 - index;
                const userProfile = profileMap[member.user_id];
                
                let avatarHtml = `
                    <div class="w-14 h-14 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center font-bold text-lg border-2 border-white shadow-sm relative" style="z-index: ${zIndex}" title="${name}">
                        ${initial}
                    </div>
                `;

                if (userProfile) {
                    if (userProfile.avatar_url) {
                        avatarHtml = `<img src="${userProfile.avatar_url}" class="w-14 h-14 rounded-full object-cover border-2 border-white shadow-sm relative" style="z-index: ${zIndex}" title="${name}">`;
                    } else if (userProfile.avatar_color && userProfile.username) {
                        const colorCode = userProfile.avatar_color.replace('#', '');
                        const generatedUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(userProfile.username)}&background=${colorCode}&color=fff&size=128`;
                        avatarHtml = `<img src="${generatedUrl}" class="w-14 h-14 rounded-full object-cover border-2 border-white shadow-sm relative" style="z-index: ${zIndex}" title="${name}">`;
                    }
                }

                membersList.insertAdjacentHTML('beforeend', avatarHtml);
            });

            // Add Invite Slot
            membersList.insertAdjacentHTML('beforeend', `
                <button onclick="copyLink()" class="w-14 h-14 rounded-full border-2 border-dashed border-gray-300 text-gray-400 flex items-center justify-center bg-gray-50 hover:bg-gray-100 hover:border-gray-400 transition-colors" style="z-index: 0">
                    <i class="ph ph-plus text-xl"></i>
                </button>
            `);
        }

        function setupRealtime() {
            // Listen to new members joining
            supabaseClient
                .channel('room_members_changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'room_members', filter: `room_id=eq.${roomId}` }, payload => {
                    console.log('Member change:', payload);
                    fetchAndRenderMembers();
                })
                .subscribe();

            // Listen to room status changes
            supabaseClient
                .channel('room_status_changes')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` }, payload => {
                    console.log('Room updated:', payload);
                    if (payload.new.status === 'swiping') {
                        isIntentionalNavigation = true;
                        window.location.href = `../play/swipe.html?id=${roomId}`;
                    }
                })
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'rooms', filter: `id=eq.${roomId}` }, payload => {
                    alert('โฮสต์ได้ยกเลิกห้องนี้แล้ว');
                    isIntentionalNavigation = true;
                    window.location.href = '../room/main.html';
                })
                .subscribe();
        }

        document.getElementById('leaveRoomBtn')?.addEventListener('click', async () => {
            if (confirm('คุณแน่ใจหรือไม่ที่จะออกจากห้อง?')) {
                isIntentionalNavigation = true;
                if (isHost) {
                    await supabaseClient.from('room_members').delete().eq('room_id', roomId);
                    await supabaseClient.from('rooms').delete().eq('id', roomId);
                } else {
                    await supabaseClient.from('room_members').delete().eq('room_id', roomId).eq('user_id', currentUser.id);
                }
                window.location.href = '../room/main.html';
            }
        });

        document.getElementById('startBtn')?.addEventListener('click', async () => {
            const btn = document.getElementById('startBtn');
            btn.innerHTML = 'กำลังเริ่ม...';
            btn.disabled = true;

            const { error } = await supabaseClient
                .from('rooms')
                .update({ status: 'swiping' })
                .eq('id', roomId);

            if (error) {
                alert('เกิดข้อผิดพลาด: ' + error.message);
                btn.innerHTML = 'เริ่มสไลด์เลย! <i class="ph-bold ph-arrow-right"></i>';
                btn.disabled = false;
            }
        });

        // Copy Link logic
        function copyLink() {
            const url = window.location.origin + '/room/join.html?code=' + roomCode;
            navigator.clipboard.writeText(url).then(() => {
                alert('คัดลอกลิงก์เชิญเพื่อนเรียบร้อยแล้ว!');
            }).catch(() => {
                // Fallback for some browsers
                alert('รหัสห้องของคุณคือ: ' + roomCode);
            });
        }
    </script>
</body>
</html>
