<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FeedMatch - เข้าสู่ระบบ</title>

        <!-- Tailwind CSS via CDN -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Google Fonts for typography -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">

        <!-- Phosphor Icons for UI Icons -->
        <script src="https://unpkg.com/@phosphor-icons/web"></script>

        <style>
        html, body {
            overflow-x: hidden !important;
            width: 100% !important;
            max-width: 100% !important;
            position: relative;
        }
        body { font-family: 'Noto Sans Thai', 'Inter', sans-serif; }
        .font-heading { font-family: 'Outfit', sans-serif; }

        /* Glassmorphism effect */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        /* Floating animation for logo */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        </style>
    <link rel="icon" type="image/png" href="./assets/images/Logoremovebg.png">
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-50 relative overflow-hidden px-4 sm:px-6">

    <!-- Beautiful Ambient Background Blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] rounded-full bg-rose-400/30 blur-3xl mix-blend-multiply"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-orange-400/20 blur-3xl mix-blend-multiply"></div>
    </div>

    <!-- Main Login Card -->
    <div class="glass-panel w-full max-w-md rounded-[2rem] p-8 sm:p-10 relative z-10 transition-transform duration-500 hover:scale-[1.02]">

        <!-- Header / Branding -->
        <div class="text-center mb-10">
            <img src="assets/images/Logoremovebg.png" alt="FeedMatch" class="w-64 sm:w-72 mx-auto mb-4 animate-float">
            <p class="mt-3 text-gray-500 font-medium">
                เข้าสู่ระบบเพื่อเลือกมื้ออร่อยของคุณ
            </p>
    </div>

<!-- Login Form -->
<form id="loginForm" class="space-y-6" action="room/main.html" method="GET">

    <!-- Email Input -->
    <div class="relative">
        <label for="email" class="sr-only">อีเมล</label>
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
            <i class="ph ph-envelope-simple text-xl"></i>
        </div>
    <input
                    id="email" 
                    name="email" 
                    type="email" 
                    autocomplete="email" 
                    required 
                    placeholder="อีเมล"
                    class="block w-full pl-12 pr-4 py-3.5 bg-white/60 border border-white/50 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:bg-white transition-all duration-300"
                >
</div>

<!-- Password Input -->
<div class="relative group">
    <label for="password" class="sr-only">รหัสผ่าน</label>
    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
        <i class="ph ph-lock-key text-xl"></i>
    </div>
<input
                    id="password" 
                    name="password" 
                    type="password" 
                    autocomplete="current-password" 
                    required 
                    placeholder="รหัสผ่าน"
                    class="block w-full pl-12 pr-12 py-3.5 bg-white/60 border border-white/50 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:bg-white transition-all duration-300"
                >
<div id="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 cursor-pointer hover:text-rose-500 transition-colors">
    <i id="toggleIcon" class="ph ph-eye text-xl"></i>
</div>
</div>

<!-- Forgot Password -->
<div class="flex items-center justify-end">
    <a href="auth/forgot_password.html" class="text-sm font-semibold text-rose-500 hover:text-rose-600 transition-colors">
                    ลืมรหัสผ่าน?
    </a>
</div>

<!-- Action Button -->
<div class="pt-2">
    <button
                    type="submit" 
                    class="group relative w-full flex justify-center items-center gap-2 py-3.5 px-4 rounded-xl text-white font-semibold bg-gradient-to-r from-rose-500 to-orange-500 hover:from-rose-600 hover:to-orange-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-rose-500 shadow-lg shadow-rose-500/25 transition-all duration-300 overflow-hidden"
                >
    <span class="absolute w-0 h-0 transition-all duration-500 ease-out bg-white rounded-full group-hover:w-56 group-hover:h-56 opacity-10"></span>
    <span class="relative">เข้าสู่ระบบ</span>
    <i class="ph ph-arrow-right font-bold relative group-hover:translate-x-1 transition-transform"></i>
</button>
</div>
</form>

<!-- Footer -->
<div class="mt-8 text-center border-t border-gray-200/50 pt-6">
    <p class="text-gray-600 font-medium">
                ยังไม่มีบัญชีใช่ไหม? 
        <a href="auth/register.html" class="font-bold text-rose-500 hover:text-rose-600 transition-colors ml-1 underline decoration-2 decoration-rose-500/30 underline-offset-4 hover:decoration-rose-500">
                    สมัครสมาชิก
        </a>
</p>
</div>

</div>

<!-- Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Our Supabase Config -->
<script src="js/supabase-config.js"></script>
<script>
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const toggleIcon = document.getElementById('toggleIcon');
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault(); // ป้องกันไม่ให้ Form รีเฟรชหน้าเว็บ
            
            const submitBtn = loginForm.querySelector('button[type="submit"] span.relative');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'กำลังเข้าสู่ระบบ...';

            // ยิงข้อมูลไปที่ Supabase
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: emailInput.value,
                password: passwordInput.value,
            });

            if (error) {
                alert('เข้าสู่ระบบไม่สำเร็จ: อีเมลหรือรหัสผ่านไม่ถูกต้อง');
                submitBtn.innerText = originalText;
            } else {
                console.log('Login successful!', data);
                // เมื่อสำเร็จให้ไปที่หน้า main.html
                window.location.href = 'room/main.html';
            }
        });

        togglePassword.addEventListener('click', function () {
            // Toggle the type attribute
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            // Toggle the eye / eye slash icon
            if (type === 'password') {
                toggleIcon.classList.remove('ph-eye-slash');
                toggleIcon.classList.add('ph-eye');
            } else {
                toggleIcon.classList.remove('ph-eye');
                toggleIcon.classList.add('ph-eye-slash');
            }
        });
</script>
</body>
</html>
