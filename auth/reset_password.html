<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FeedMatch - ตั้งรหัสผ่านใหม่</title>

        <!-- Tailwind CSS via CDN -->
        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Google Fonts for typography -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">

        <!-- Phosphor Icons for UI Icons -->
        <script src="https://unpkg.com/@phosphor-icons/web"></script>

        <style>
        html, body {
            overflow-x: hidden !important;
            width: 100% !important;
            max-width: 100% !important;
            position: relative;
        }
        body { font-family: 'Noto Sans Thai', 'Inter', sans-serif; }
        .font-heading { font-family: 'Outfit', sans-serif; }

        /* Glassmorphism effect */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        /* Floating animation for logo */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        </style>
    <link rel="icon" type="image/png" href="../assets/images/Logoremovebg.png">
</head>
<body class="min-h-screen flex flex-col justify-center bg-gray-50 relative overflow-hidden py-12 sm:px-6 lg:px-8">

    <!-- Beautiful Ambient Background Blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[40vw] h-[40vw] rounded-full bg-rose-400/30 blur-3xl mix-blend-multiply"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-orange-400/20 blur-3xl mix-blend-multiply"></div>
    </div>

    <!-- Main Reset Password Card -->
    <div class="glass-panel w-full max-w-md rounded-[2rem] p-8 sm:p-10 relative z-10 transition-transform duration-500 hover:scale-[1.02] mx-auto">

        <!-- Header / Branding -->
        <div class="text-center mb-8">
            <img src="../assets/images/Logoremovebg.png" alt="FeedMatch" class="w-64 sm:w-72 mx-auto mb-4 animate-float">

            <h1 class="text-2xl font-bold text-gray-800 text-center mt-6">
                ตั้งรหัสผ่านใหม่
            </h1>
            <p class="text-gray-500 text-center mt-2 text-sm px-4">
                กรุณากำหนดรหัสผ่านใหม่ของคุณที่มีความยาวอย่างน้อย 6 ตัวอักษร
            </p>
        </div>

        <!-- Reset Password Form -->
        <form id="resetForm" class="space-y-6">

            <!-- Password Input -->
            <div>
                <label for="password" class="font-bold text-gray-700 text-sm mb-2 block">รหัสผ่านใหม่ (New Password)</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                        <i class="ph ph-lock-key text-xl"></i>
                    </div>
                    <input
                        id="password" 
                        name="password" 
                        type="password" 
                        required 
                        minlength="6"
                        placeholder="รหัสผ่านอย่างน้อย 6 ตัวอักษร"
                        class="block w-full pl-12 pr-12 py-3.5 bg-white/60 border border-white/50 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:bg-white transition-all duration-300"
                    >
                    <div id="togglePassword" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 cursor-pointer hover:text-rose-500 transition-colors">
                        <i id="toggleIcon" class="ph ph-eye text-xl"></i>
                    </div>
                </div>
            </div>

            <!-- Action Button -->
            <div class="pt-2">
                <button
                    type="submit" 
                    class="group relative w-full flex justify-center items-center gap-2 py-3 px-4 rounded-xl text-white font-bold bg-orange-500 hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 shadow-md transition mt-6 block overflow-hidden"
                >
                    <span class="absolute w-0 h-0 transition-all duration-500 ease-out bg-white rounded-full group-hover:w-56 group-hover:h-56 opacity-10"></span>
                    <span class="relative">บันทึกรหัสผ่านใหม่</span>
                </button>
            </div>
        </form>

        <!-- Footer -->
        <div class="mt-8 text-center pt-2">
            <a href="../index.html" class="flex items-center justify-center text-orange-500 hover:underline text-sm font-medium transition-colors">
                <i class="ph ph-arrow-left mr-2"></i>
                กลับไปหน้าเข้าสู่ระบบ
            </a>
        </div>

    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script>
        const resetForm = document.getElementById('resetForm');
        
        resetForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('password').value.trim();
            const submitBtn = resetForm.querySelector('button[type="submit"] span.relative');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'กำลังบันทึก...';

            const { data, error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                alert('เกิดข้อผิดพลาด: ' + error.message);
                submitBtn.innerText = originalText;
            } else {
                alert('เปลี่ยนรหัสผ่านสำเร็จ! กรุณาเข้าสู่ระบบด้วยรหัสผ่านใหม่');
                window.location.href = '../index.html';
            }
        });

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            if (type === 'password') {
                toggleIcon.classList.remove('ph-eye-slash');
                toggleIcon.classList.add('ph-eye');
            } else {
                toggleIcon.classList.remove('ph-eye');
                toggleIcon.classList.add('ph-eye-slash');
            }
        });
    </script>
</body>
</html>
