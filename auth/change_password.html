<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เปลี่ยนรหัสผ่าน - FeedMatch</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons (for eye toggles) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Thai', 'Inter', sans-serif;
        }
        .font-heading { font-family: 'Outfit', sans-serif; }
    </style>
    <link rel="icon" type="image/png" href="../assets/images/Logoremovebg.png">
</head>
<body class="min-h-screen bg-gray-50 flex flex-col text-gray-800">

    <!-- Standard Header -->
    <header class="w-full bg-white shadow-sm px-8 py-4 relative z-50 flex justify-between items-center shrink-0 sticky top-0">
        <!-- Left: Logo -->
        <div class="flex items-center">
            <img src="../assets/images/Logoremovebg.png" alt="FeedMatch Logo" class="h-16 w-auto object-contain">
        </div>

        <!-- Right: Close Button -->
        <a href="../user/profile.html" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-red-100 hover:text-red-600 transition-colors duration-200">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </a>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center p-4 mt-8 mb-12">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8 md:p-10 border border-gray-100">

            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">เปลี่ยนรหัสผ่าน</h1>
                <p class="text-gray-500 mt-2 text-sm">ตั้งรหัสผ่านใหม่ให้คาดเดายากเพื่อความปลอดภัย</p>
            </div>

            <!-- Form -->
            <form action="../user/profile.html" class="space-y-6">

                <!-- Current Password -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">รหัสผ่านปัจจุบัน</label>
                    <div class="relative">
                        <input type="password" id="current_password" required
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all placeholder-gray-400"
                            placeholder="กรอกรหัสผ่านปัจจุบันของคุณ">
                        <button type="button" onclick="togglePassword('current_password', 'icon_current')" class="absolute inset-y-0 right-4 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                            <i id="icon_current" class="ph ph-eye text-xl"></i>
                        </button>
                    </div>
                </div>

                <!-- New Password -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">รหัสผ่านใหม่</label>
                    <div class="relative">
                        <input type="password" id="new_password" required minlength="6"
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all placeholder-gray-400"
                            placeholder="ต้องมีความยาวอย่างน้อย 6 ตัวอักษร">
                        <button type="button" onclick="togglePassword('new_password', 'icon_new')" class="absolute inset-y-0 right-4 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                            <i id="icon_new" class="ph ph-eye text-xl"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm New Password -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">ยืนยันรหัสผ่านใหม่</label>
                    <div class="relative">
                        <input type="password" id="confirm_password" required
                            class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition-all placeholder-gray-400"
                            placeholder="กรอกรหัสผ่านใหม่อีกครั้ง">
                        <button type="button" onclick="togglePassword('confirm_password', 'icon_confirm')" class="absolute inset-y-0 right-4 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                            <i id="icon_confirm" class="ph ph-eye text-xl"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-300 mt-8">
                    อัปเดตรหัสผ่าน
                </button>

            </form>
        </div>
    </main>

    <!-- Password Toggle Script -->
    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('ph-eye');
                icon.classList.add('ph-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('ph-eye-slash');
                icon.classList.add('ph-eye');
            }
        }
    </script>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = '../index.html';
                return;
            }

            const form = document.querySelector('form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const currentPassword = document.getElementById('current_password').value;
                const newPassword = document.getElementById('new_password').value;
                const confirmPassword = document.getElementById('confirm_password').value;
                const submitBtn = form.querySelector('button[type="submit"]');

                if (newPassword !== confirmPassword) {
                    alert('รหัสผ่านใหม่ไม่ตรงกัน');
                    return;
                }

                if (newPassword.length < 6) {
                    alert('รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร');
                    return;
                }

                submitBtn.textContent = 'กำลังอัปเดต...';
                submitBtn.disabled = true;

                // 1. Verify current password by attempting to sign in
                const { error: signInError } = await supabaseClient.auth.signInWithPassword({
                    email: session.user.email,
                    password: currentPassword,
                });

                if (signInError) {
                    alert('รหัสผ่านปัจจุบันไม่ถูกต้อง');
                    submitBtn.textContent = 'อัปเดตรหัสผ่าน';
                    submitBtn.disabled = false;
                    return;
                }

                // 2. If correct, update the password
                const { error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) {
                    alert('เกิดข้อผิดพลาด: ' + error.message);
                    submitBtn.textContent = 'อัปเดตรหัสผ่าน';
                    submitBtn.disabled = false;
                } else {
                    alert('เปลี่ยนรหัสผ่านสำเร็จ!');
                    window.location.href = '../user/profile.html';
                }
            });
        });
    </script>
</body>
</html>
