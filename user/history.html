<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ประวัติการกินล่าสุด - FeedMatch</title>
        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Supabase SDK -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabase-config.js"></script>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
        <style>
        body {
            font-family: 'Noto Sans Thai', 'Inter', sans-serif;
        }
        .font-heading { font-family: 'Outfit', sans-serif; }
        </style>
    <link rel="icon" type="image/png" href="../assets/images/Logoremovebg.png">
</head>
<body class="min-h-screen bg-gray-50 flex flex-col">

    <!-- Standard Header -->
    <header class="w-full bg-white shadow-sm px-8 py-4 relative z-50 flex justify-between items-center shrink-0 sticky top-0">
        <!-- Left: Logo -->
        <div class="flex items-center">
            <img src="../assets/images/Logoremovebg.png" alt="FeedMatch Logo" class="h-16 w-auto object-contain">
        </div>

    <!-- Right: Close Button -->
    <a href="../room/main.html" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-red-100 hover:text-red-600 transition-colors duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
</a>
</header>

<!-- Main Container -->
<main class="w-full max-w-5xl mx-auto px-4 mt-12 mb-20 flex-grow">

    <!-- Page Header -->
    <header>
        <h1 class="text-3xl font-bold text-gray-800 tracking-tight">ประวัติการกินล่าสุด</h1>
        <p class="text-gray-500 mt-2 text-lg">ดูร้านอาหารที่คุณและเพื่อนเคยแมตช์สำเร็จ</p>
    </header>

<!-- History Grid -->
<div id="history-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-8">
    <!-- Loading State -->
    <div class="col-span-full text-center py-20">
        <i class="ph ph-spinner-gap animate-spin text-5xl text-orange-500 mb-4 inline-block"></i>
        <p class="text-gray-500 text-lg">กำลังโหลดประวัติการแมตช์...</p>
    </div>
</div>

<!-- Empty State (Hidden initially) -->
<div id="empty-state" class="hidden flex-col items-center justify-center py-20 px-4 text-center bg-white rounded-3xl shadow-sm border border-gray-100 mt-8">
    <div class="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center mb-6 text-gray-300">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.53 16.122a3 3 0 00-5.78 1.128 2.25 2.25 0 01-2.4 2.245 4.5 4.5 0 008.4-2.245c0-.399-.078-.78-.22-1.128zm0 0a15.998 15.998 0 003.388-1.62m-5.043-.025a15.994 15.994 0 011.622-3.395m3.42 3.42a15.995 15.995 0 004.764-4.648l3.813-1.663-1.663 3.813a15.995 15.995 0 00-4.648 4.764m-3.42-3.42a15.995 15.995 0 01-4.764 4.648l-3.813 1.663 1.663-3.813a15.995 15.995 0 014.648-4.764m3.42 3.42a15.995 15.995 0 004.764-4.648" />
        </svg>
    </div>
    <h3 class="text-2xl font-bold text-gray-800 mb-2">ยังไม่มีประวัติการแมตช์</h3>
    <p class="text-gray-500 mb-8 max-w-md">ชวนเพื่อนมาหาของกินอร่อยๆ และเริ่มต้นการแมตช์ของคุณกันเลย!</p>
    <a href="../room/main.html" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 px-8 rounded-full shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">
        กลับไปหน้าหลัก
    </a>
</div>

</main>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const historyGrid = document.getElementById('history-grid');
        const emptyState = document.getElementById('empty-state');

        // Check authentication
        const { data: { session }, error: authError } = await supabaseClient.auth.getSession();
        if (authError || !session) {
            window.location.href = '../index.html';
            return;
        }

        const userId = session.user.id;

        // Fetch rooms where the user was a member
        const { data: memberRooms } = await supabaseClient
            .from('room_members')
            .select('room_id')
            .eq('user_id', userId);

        // Fetch rooms where the user swiped
        const { data: swipedRooms } = await supabaseClient
            .from('swipes')
            .select('room_id')
            .eq('user_id', userId);

        // Fetch rooms where the user is host
        const { data: hostedRooms } = await supabaseClient
            .from('rooms')
            .select('id')
            .eq('host_id', userId);

        const roomIdsSet = new Set();
        if (memberRooms) memberRooms.forEach(r => roomIdsSet.add(r.room_id));
        if (swipedRooms) swipedRooms.forEach(r => roomIdsSet.add(r.room_id));
        if (hostedRooms) hostedRooms.forEach(r => roomIdsSet.add(r.id));

        // Filter out any undefined/null values just in case
        const roomIds = Array.from(roomIdsSet).filter(Boolean);
        console.log("Debug roomIds:", roomIds);

        if (roomIds.length === 0) {
            console.log("No roomIds found for user");
            historyGrid.style.display = 'none';
            emptyState.classList.remove('hidden');
            emptyState.classList.add('flex');
            return;
        }

        // Fetch matches for these rooms, latest 5 (without created_at since it doesn't exist)
        const { data: matches, error: matchError } = await supabaseClient
            .from('matches')
            .select('room_id, restaurants(*)')
            .in('room_id', roomIds)
            .limit(5);

        console.log("Debug matches fetched:", matches, "Error:", matchError);

        if (matchError) {
            console.error("Match error details:");
            console.error("- Message:", matchError.message);
            console.error("- Details:", matchError.details);
            console.error("- Hint:", matchError.hint);
            console.error("- Code:", matchError.code);
            alert(`เกิดข้อผิดพลาดในการโหลดประวัติ\nMessage: ${matchError.message}\nDetails: ${matchError.details}\nHint: ${matchError.hint}`);
        }

        if (matchError || !matches || matches.length === 0) {
            console.log("No matches found or error occurred");
            historyGrid.style.display = 'none';
            emptyState.classList.remove('hidden');
            emptyState.classList.add('flex');
            return;
        }

        // Render matches
        historyGrid.innerHTML = '';
        matches.forEach(match => {
            const food = match.restaurants;
            let dateStr = 'ล่าสุด';
            if (match.created_at) {
                const dateObj = new Date(match.created_at);
                dateStr = dateObj.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
            }

            const card = document.createElement('div');
            card.className = "bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition-shadow flex flex-col cursor-pointer group";
            card.innerHTML = `
                <div class="relative">
                    <img src="${food.image_url}" alt="${food.name}" class="h-48 w-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <div class="absolute inset-0 bg-black bg-opacity-10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                </div>

                <div class="p-5 flex flex-col flex-grow">
                    <!-- Top Row: Badge & Date -->
                    <div class="flex justify-between items-center mb-3">
                        <span class="bg-green-100 text-green-700 text-xs font-bold px-2.5 py-1 rounded-full flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5">
                                <path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006z" clip-rule="evenodd" />
                            </svg>
                            แมตช์สำเร็จ 100%
                        </span>
                        <span class="text-gray-400 text-sm font-medium">${dateStr}</span>
                    </div>

                    <!-- Title -->
                    <h3 class="text-xl font-bold text-gray-800 mb-1">${food.name}</h3>

                    <!-- Details -->
                    <div class="flex items-center gap-1.5 text-gray-500 text-sm mt-1 mb-4">
                        <i class="ph ph-map-pin text-gray-400 text-lg"></i>
                        <span>${food.category || 'ร้านอาหาร'} ${food.distance_km ? `• ${food.distance_km} กม.` : ''}</span>
                    </div>
                </div>
            `;
            
            // On click, go to map navigation page
            card.addEventListener('click', () => {
                window.location.href = `../play/map_navigation.html?id=${food.id}&room_id=${match.room_id}&from=history`;
            });

            historyGrid.appendChild(card);
        });
    });
</script>

</body>
</html>
