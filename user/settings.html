<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script>
    let currentLat = null;
    let currentLng = null;
    let currentLocationName = 'ตำแหน่งปัจจุบัน';
    let currentUser = null;
    let currentRestrictions = [];

    const locationText = document.getElementById('location-text');
    const changeLocationBtn = document.getElementById('change-location-btn');
    const distanceSlider = document.getElementById('distance-slider');
    const distanceBadge = document.getElementById('distance-badge');
    const priceCheckboxes = document.querySelectorAll('.price-level-cb');
    const saveBtn = document.getElementById('save-settings-btn');

    // Make the save button act as a submit
    saveBtn.href = "#";
    saveBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        saveBtn.innerText = 'กำลังบันทึก...';
        
        if (!currentUser) return;
        
        const maxDistance = parseInt(distanceSlider.value) || 5;
        
        // Get selected price levels
        const selectedPriceLevels = Array.from(priceCheckboxes)
            .filter(cb => cb.checked)
            .map(cb => cb.value);

        const { error } = await supabaseClient
            .from('profiles')
            .update({
                lat: currentLat,
                lng: currentLng,
                location_name: currentLocationName,
                max_distance: maxDistance,
                price_levels: selectedPriceLevels,
                dietary_restrictions: currentRestrictions
            })
            .eq('id', currentUser.id);

        if (error) {
            console.error('Error saving settings:', {
                message: error.message,
                details: error.details,
                hint: error.hint
            });
            alert(`ไม่สามารถบันทึกการตั้งค่าได้: ${error.message || 'เกิดข้อผิดพลาด'}`);
            saveBtn.innerText = 'บันทึกการตั้งค่า';
        } else {
            window.location.href = '../room/main.html';
        }
    });

    async function loadSettings() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = '../index.html';
            return;
        }
        currentUser = session.user;

        const { data: profile } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .single();

        if (profile) {
            if (profile.location_name) {
                currentLocationName = profile.location_name;
                locationText.innerText = currentLocationName;
            } else {
                locationText.innerText = 'ยังไม่ได้ตั้งค่า (กดเปลี่ยนเพื่อหาตำแหน่ง)';
            }

            if (profile.lat && profile.lng) {
                currentLat = profile.lat;
                currentLng = profile.lng;
            } else {
                // Auto fetch if no location is set
                fetchCurrentLocation();
            }
            if (profile.max_distance) {
                distanceSlider.value = profile.max_distance;
                distanceBadge.innerHTML = `${profile.max_distance}<span class='text-lg text-gray-400 font-medium ml-1'>กม.</span>`;
            }
            if (profile.price_levels && Array.isArray(profile.price_levels)) {
                priceCheckboxes.forEach(cb => {
                    if (profile.price_levels.includes(cb.value)) {
                        cb.checked = true;
                    }
                });
            }
            if (profile.dietary_restrictions && Array.isArray(profile.dietary_restrictions)) {
                currentRestrictions = profile.dietary_restrictions;
            }
        }

        // Fetch unique categories
        let uniqueCategories = ["อาหารไทย", "อาหารญี่ปุ่น", "คาเฟ่/ของหวาน", "อาหารจานเดียว"]; // Fallback
        try {
            const { data: restData, error: restError } = await supabaseClient.from('restaurants').select('category');
            if (restData && !restError) {
                const categories = restData.map(r => r.category).filter(Boolean);
                if (categories.length > 0) {
                    uniqueCategories = [...new Set(categories)];
                }
            }
        } catch (e) {
            console.error("Error fetching categories:", e);
        }

        currentRestrictions = currentRestrictions.filter(cat => uniqueCategories.includes(cat));

        const dietContainer = document.getElementById('diet-container');
        if (dietContainer) {
            dietContainer.innerHTML = '';
            uniqueCategories.forEach(cat => {
                const btn = document.createElement('div');
                btn.textContent = cat;
                btn.className = "diet-btn bg-white text-gray-600 border border-gray-300 px-4 py-2 rounded-full text-sm font-medium transition-colors cursor-pointer";
                
                if (currentRestrictions.includes(cat)) {
                    btn.classList.add('bg-orange-500', 'text-white', 'border-orange-500');
                    btn.classList.remove('bg-white', 'text-gray-600', 'border-gray-300');
                }
                
                btn.addEventListener('click', () => {
                    if (currentRestrictions.includes(cat)) {
                        currentRestrictions = currentRestrictions.filter(d => d !== cat);
                        btn.classList.remove('bg-orange-500', 'text-white', 'border-orange-500');
                        btn.classList.add('bg-white', 'text-gray-600', 'border-gray-300');
                    } else {
                        currentRestrictions.push(cat);
                        btn.classList.add('bg-orange-500', 'text-white', 'border-orange-500');
                        btn.classList.remove('bg-white', 'text-gray-600', 'border-gray-300');
                    }
                });
                dietContainer.appendChild(btn);
            });
        }
    }

    function fetchCurrentLocation() {
        const btn = changeLocationBtn;
        const originalText = btn.innerText;
        btn.innerText = 'กำลังหา...';
        btn.classList.add('animate-pulse');

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(function(position) {
                currentLat = position.coords.latitude;
                currentLng = position.coords.longitude;
                
                // Use OpenStreetMap Nominatim API for free reverse geocoding with high zoom (18) for street-level accuracy
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLng}&zoom=18&addressdetails=1`)
                    .then(response => response.json())
                    .then(data => {
                        let locationName = '';
                        if (data && data.address) {
                            const addr = data.address;
                            // Extract meaningful location parts
                            let localArea = addr.suburb || addr.town || addr.city_district || addr.county || addr.city || '';
                            let province = addr.state || addr.province || '';
                            
                            if (localArea === province) {
                                locationName = province;
                            } else if (localArea && province) {
                                locationName = `${localArea}, ${province}`;
                            } else {
                                locationName = localArea || province || addr.village || addr.road || 'ตำแหน่งปัจจุบัน';
                            }
                        } else {
                            locationName = `${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`;
                        }
                        currentLocationName = locationName;
                        locationText.innerText = locationName;
                        btn.innerText = 'เปลี่ยน';
                        btn.classList.remove('animate-pulse');
                    })
                    .catch(error => {
                        console.error('Error fetching location name:', error);
                        currentLocationName = `${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`;
                        locationText.innerText = currentLocationName;
                        btn.innerText = 'เปลี่ยน';
                        btn.classList.remove('animate-pulse');
                    });
            }, function(error) {
                console.error('Geolocation error:', error);
                locationText.innerText = 'ไม่สามารถระบุตำแหน่งได้';
                btn.innerText = 'เปลี่ยน';
                btn.classList.remove('animate-pulse');
            }, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        } else {
            locationText.innerText = 'อุปกรณ์ไม่รองรับ';
            btn.innerText = 'เปลี่ยน';
            btn.classList.remove('animate-pulse');
        }
    }

    changeLocationBtn.addEventListener('click', fetchCurrentLocation);

    // Data
    const districtData = {
        'กรุงเทพมหานคร': [
            { name: 'ปทุมวัน', lat: 13.7367, lng: 100.5231 },
            { name: 'วัฒนา', lat: 13.7423, lng: 100.5540 },
            { name: 'สาทร', lat: 13.7088, lng: 100.5262 },
            { name: 'บางรัก', lat: 13.7308, lng: 100.5238 },
            { name: 'จตุจักร', lat: 13.8282, lng: 100.5594 }
        ],
        'เชียงใหม่': [
            { name: 'เมืองเชียงใหม่', lat: 18.7953, lng: 98.9620 },
            { name: 'หางดง', lat: 18.6875, lng: 98.9192 },
            { name: 'แม่ริม', lat: 18.9145, lng: 98.9461 },
            { name: 'สันทราย', lat: 18.8475, lng: 99.0435 }
        ],
        'ภูเก็ต': [
            { name: 'เมืองภูเก็ต', lat: 7.8804, lng: 98.3923 },
            { name: 'กะทู้', lat: 7.9176, lng: 98.3323 },
            { name: 'ถลาง', lat: 8.0287, lng: 98.3347 }
        ],
        'ชลบุรี': [
            { name: 'เมืองชลบุรี', lat: 13.3611, lng: 100.9847 },
            { name: 'บางละมุง (พัทยา)', lat: 12.9754, lng: 100.9022 },
            { name: 'ศรีราชา', lat: 13.1737, lng: 100.9311 }
        ],
        'นครราชสีมา': [
            { name: 'เมืองนครราชสีมา', lat: 14.9799, lng: 102.0978 },
            { name: 'ปากช่อง (เขาใหญ่)', lat: 14.7042, lng: 101.4162 }
        ],
        'ขอนแก่น': [
            { name: 'เมืองขอนแก่น', lat: 16.4322, lng: 102.8236 },
            { name: 'บ้านเป็ด', lat: 16.4334, lng: 102.7761 }
        ],
        'สงขลา': [
            { name: 'เมืองสงขลา', lat: 7.1898, lng: 100.5954 },
            { name: 'หาดใหญ่', lat: 7.0094, lng: 100.4735 }
        ],
        'ประจวบคีรีขันธ์': [
            { name: 'เมืองประจวบคีรีขันธ์', lat: 11.8123, lng: 99.7972 },
            { name: 'หัวหิน', lat: 12.5657, lng: 99.9579 }
        ]
    };

    let currentSelectedProvince = '';

    // Province Modal Logic
    const selectProvinceBtn = document.getElementById('select-province-btn');
    const provinceBtnText = document.getElementById('province-btn-text');
    const provinceModal = document.getElementById('province-modal');
    const provinceModalContent = document.getElementById('province-modal-content');
    const closeProvinceModalBtn = document.getElementById('close-province-modal');
    const provinceBtns = document.querySelectorAll('.province-btn');

    // District Modal Logic
    const selectDistrictBtn = document.getElementById('select-district-btn');
    const districtBtnText = document.getElementById('district-btn-text');
    const districtModal = document.getElementById('district-modal');
    const districtModalContentBox = document.getElementById('district-modal-content-box');
    const closeDistrictModalBtn = document.getElementById('close-district-modal');
    const districtList = document.getElementById('district-list');

    function openModal(modal, box) {
        modal.classList.remove('hidden');
        void modal.offsetWidth;
        modal.classList.remove('opacity-0', 'pointer-events-none');
        box.classList.remove('scale-95');
        box.classList.add('scale-100');
    }

    function closeModal(modal, box) {
        modal.classList.add('opacity-0', 'pointer-events-none');
        box.classList.remove('scale-100');
        box.classList.add('scale-95');
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 300);
    }

    selectProvinceBtn.addEventListener('click', () => openModal(provinceModal, provinceModalContent));
    closeProvinceModalBtn.addEventListener('click', () => closeModal(provinceModal, provinceModalContent));
    
    selectDistrictBtn.addEventListener('click', () => openModal(districtModal, districtModalContentBox));
    closeDistrictModalBtn.addEventListener('click', () => closeModal(districtModal, districtModalContentBox));

    provinceBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const pname = btn.dataset.name;
            currentLat = parseFloat(btn.dataset.lat);
            currentLng = parseFloat(btn.dataset.lng);
            currentSelectedProvince = pname;
            currentLocationName = pname;
            locationText.innerText = pname;
            provinceBtnText.innerText = pname;
            
            // Enable district button
            selectDistrictBtn.disabled = false;
            selectDistrictBtn.classList.remove('bg-gray-100', 'text-gray-400', 'opacity-70', 'cursor-not-allowed');
            selectDistrictBtn.classList.add('bg-orange-50', 'text-orange-600', 'hover:bg-orange-100', 'hover:text-orange-700', 'border-orange-200');
            districtBtnText.innerText = 'เลือกอำเภอ';
            
            // Populate district list
            districtList.innerHTML = '';
            if (districtData[pname]) {
                districtData[pname].forEach(d => {
                    const dbtn = document.createElement('button');
                    dbtn.className = "w-full flex items-center gap-3 px-4 py-3.5 border border-gray-100 rounded-2xl hover:bg-orange-50 hover:border-orange-200 hover:shadow-sm transition-all group text-left";
                    dbtn.innerHTML = \`
                        <div class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 group-hover:bg-orange-100 group-hover:text-orange-500 transition-colors shrink-0">
                            <i class="ph ph-map-pin"></i>
                        </div>
                        <span class="font-medium text-gray-700 group-hover:text-orange-600">\${d.name}</span>
                    \`;
                    dbtn.onclick = () => {
                        currentLat = d.lat;
                        currentLng = d.lng;
                        currentLocationName = \`\${d.name}, \${pname}\`;
                        locationText.innerText = currentLocationName;
                        districtBtnText.innerText = d.name;
                        closeModal(districtModal, districtModalContentBox);
                    };
                    districtList.appendChild(dbtn);
                });
            }
            
            closeModal(provinceModal, provinceModalContent);
            
            // Automatically open district modal
            setTimeout(() => {
                openModal(districtModal, districtModalContentBox);
            }, 350);
        });
    });

    loadSettings();
</script>
</body>
