<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ตั้งค่าการค้นหา - FeedMatch</title>
        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
        <style>
        body {
            font-family: 'Noto Sans Thai', 'Inter', sans-serif;
        }
        .font-heading { font-family: 'Outfit', sans-serif; }
        /* Custom minimalist slider */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #f97316; /* orange-500 */
            cursor: pointer;
            margin-top: -8px;
            border: 3px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #f3f4f6; /* gray-100 */
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
        /* Custom radio buttons */
        .radio-custom {
            display: none;
        }
        .radio-custom:checked + label {
            background-color: #000;
            color: #fff;
            border-color: #000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        </style>
    <link rel="icon" type="image/png" href="../assets/images/Logoremovebg.png">
</head>
<body class="min-h-screen bg-white flex flex-col text-gray-800">

    <!-- Standard Header -->
    <header class="w-full bg-white shadow-sm px-8 py-4 relative z-20 flex justify-between items-center shrink-0">
        <!-- Left: Logo -->
        <div class="flex items-center">
            <img src="../assets/images/Logoremovebg.png" alt="FeedMatch Logo" class="h-16 w-auto object-contain">
        </div>

    <!-- Right: Back Button -->
    <a href="../room/main.html" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 hover:text-gray-700 transition-colors duration-200 shadow-sm border border-gray-100">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5 pr-0.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
        </svg>
    </a>
    </header>

<!-- Main Container -->
<main class="w-full max-w-2xl mx-auto px-6 pb-12 flex-grow flex flex-col">

    <div class="space-y-8 mt-6">

        <!-- Section 1: Current Location -->
        <section class="border-b border-gray-100 pb-8">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">ตำแหน่งที่ตั้ง</h2>
            <div class="flex justify-between items-end">
                <div class="flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-orange-500">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                    </svg>
                <span class="text-xl font-medium" id="location-text">กำลังโหลด...</span>
            </div>
        <button type="button" id="change-location-btn" class="text-sm text-gray-400 hover:text-orange-500 transition-colors underline decoration-gray-200 underline-offset-4">
                        เปลี่ยน
        </button>
</div>
</section>

<!-- Section 2: Distance Radius -->
<section class="border-b border-gray-100 pb-8">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">ระยะทางสูงสุด</h2>
        <span class="text-2xl font-semibold text-gray-800" id="distance-badge">5<span class="text-lg text-gray-400 font-medium ml-1">กม.</span></span>
    </div>

<div class="px-1 mt-2">
    <input type="range" min="1" max="20" value="5" class="w-full" id="distance-slider" oninput="document.getElementById('distance-badge').innerHTML = this.value + '<span class=\'text-lg text-gray-400 font-medium ml-1\'>กม.</span>'">
<div class="flex justify-between text-xs text-gray-300 mt-4 font-light">
    <span>1 กม.</span>
    <span>20 กม.</span>
</div>
</div>
</section>

<!-- Section 3: Price Level Preference -->
<section class="pb-8">
    <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-6">ระดับราคา</h2>
    <div class="grid grid-cols-3 gap-3">
        <div>
            <input type="checkbox" id="price-budget" value="ประหยัด" class="radio-custom price-level-cb">
            <label for="price-budget" class="block w-full text-center border border-gray-200 rounded-xl py-3 font-medium text-gray-500 cursor-pointer transition-all">ประหยัด</label>
        </div>
        <div>
            <input type="checkbox" id="price-medium" value="ปานกลาง" class="radio-custom price-level-cb">
            <label for="price-medium" class="block w-full text-center border border-gray-200 rounded-xl py-3 font-medium text-gray-500 cursor-pointer transition-all">ปานกลาง</label>
        </div>
        <div>
            <input type="checkbox" id="price-luxury" value="หรูหรา" class="radio-custom price-level-cb">
            <label for="price-luxury" class="block w-full text-center border border-gray-200 rounded-xl py-3 font-medium text-gray-500 cursor-pointer transition-all">หรูหรา</label>
        </div>
    </div>
    <p class="text-xs text-gray-400 mt-3 text-center">สามารถเลือกได้มากกว่า 1 ระดับ (หากไม่เลือก จะแสดงทั้งหมด)</p>
</section>

<!-- Section 4: Preferred Categories -->
<section class="pb-8 border-t border-gray-100 pt-8">
    <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">ประเภทร้านอาหารที่อยากกิน</h2>
    <div class="flex flex-wrap gap-3" id="diet-container">
        <!-- Categories will be injected here dynamically -->
        <p class="text-sm text-gray-400">กำลังโหลดหมวดหมู่...</p>
    </div>
</section>

</div>

<!-- Save Action -->
<div class="mt-auto pt-8">
    <a href="../room/main.html" id="save-settings-btn" class="block w-full bg-orange-500 hover:bg-orange-600 text-white text-lg text-center font-medium py-4 rounded-2xl transition-all shadow-md hover:shadow-lg hover:-translate-y-0.5">
                บันทึกการตั้งค่า
    </a>
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script>
    let currentLat = null;
    let currentLng = null;
    let currentLocationName = 'ตำแหน่งปัจจุบัน';
    let currentUser = null;
    let currentRestrictions = [];

    const locationText = document.getElementById('location-text');
    const changeLocationBtn = document.getElementById('change-location-btn');
    const distanceSlider = document.getElementById('distance-slider');
    const distanceBadge = document.getElementById('distance-badge');
    const priceCheckboxes = document.querySelectorAll('.price-level-cb');
    const saveBtn = document.getElementById('save-settings-btn');

    // Make the save button act as a submit
    saveBtn.href = "#";
    saveBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        saveBtn.innerText = 'กำลังบันทึก...';
        
        if (!currentUser) return;
        
        const maxDistance = parseInt(distanceSlider.value) || 5;
        
        // Get selected price levels
        const selectedPriceLevels = Array.from(priceCheckboxes)
            .filter(cb => cb.checked)
            .map(cb => cb.value);

        const { error } = await supabaseClient
            .from('profiles')
            .update({
                lat: currentLat,
                lng: currentLng,
                location_name: currentLocationName,
                max_distance: maxDistance,
                price_levels: selectedPriceLevels,
                dietary_restrictions: currentRestrictions
            })
            .eq('id', currentUser.id);

        if (error) {
            console.error('Error saving settings:', {
                message: error.message,
                details: error.details,
                hint: error.hint
            });
            alert(`ไม่สามารถบันทึกการตั้งค่าได้: ${error.message || 'เกิดข้อผิดพลาด'}`);
            saveBtn.innerText = 'บันทึกการตั้งค่า';
        } else {
            window.location.href = '../room/main.html';
        }
    });

    async function loadSettings() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = '../index.html';
            return;
        }
        currentUser = session.user;

        const { data: profile } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .single();

        if (profile) {
            if (profile.location_name) {
                currentLocationName = profile.location_name;
                locationText.innerText = currentLocationName;
            } else {
                locationText.innerText = 'ยังไม่ได้ตั้งค่า (กดเปลี่ยนเพื่อหาตำแหน่ง)';
            }

            if (profile.lat && profile.lng) {
                currentLat = profile.lat;
                currentLng = profile.lng;
            } else {
                // Auto fetch if no location is set
                fetchCurrentLocation();
            }
            if (profile.max_distance) {
                distanceSlider.value = profile.max_distance;
                distanceBadge.innerHTML = `${profile.max_distance}<span class='text-lg text-gray-400 font-medium ml-1'>กม.</span>`;
            }
            if (profile.price_levels && Array.isArray(profile.price_levels)) {
                priceCheckboxes.forEach(cb => {
                    if (profile.price_levels.includes(cb.value)) {
                        cb.checked = true;
                    }
                });
            }
            if (profile.dietary_restrictions && Array.isArray(profile.dietary_restrictions)) {
                currentRestrictions = profile.dietary_restrictions;
            }
        }

        // Fetch unique categories
        let uniqueCategories = ["อาหารไทย", "อาหารญี่ปุ่น", "คาเฟ่/ของหวาน", "อาหารจานเดียว"]; // Fallback
        try {
            const { data: restData, error: restError } = await supabaseClient.from('restaurants').select('category');
            if (restData && !restError) {
                const categories = restData.map(r => r.category).filter(Boolean);
                if (categories.length > 0) {
                    uniqueCategories = [...new Set(categories)];
                }
            }
        } catch (e) {
            console.error("Error fetching categories:", e);
        }

        currentRestrictions = currentRestrictions.filter(cat => uniqueCategories.includes(cat));

        const dietContainer = document.getElementById('diet-container');
        if (dietContainer) {
            dietContainer.innerHTML = '';
            uniqueCategories.forEach(cat => {
                const btn = document.createElement('div');
                btn.textContent = cat;
                btn.className = "diet-btn bg-white text-gray-600 border border-gray-300 px-4 py-2 rounded-full text-sm font-medium transition-colors cursor-pointer";
                
                if (currentRestrictions.includes(cat)) {
                    btn.classList.add('bg-orange-500', 'text-white', 'border-orange-500');
                    btn.classList.remove('bg-white', 'text-gray-600', 'border-gray-300');
                }
                
                btn.addEventListener('click', () => {
                    if (currentRestrictions.includes(cat)) {
                        currentRestrictions = currentRestrictions.filter(d => d !== cat);
                        btn.classList.remove('bg-orange-500', 'text-white', 'border-orange-500');
                        btn.classList.add('bg-white', 'text-gray-600', 'border-gray-300');
                    } else {
                        currentRestrictions.push(cat);
                        btn.classList.add('bg-orange-500', 'text-white', 'border-orange-500');
                        btn.classList.remove('bg-white', 'text-gray-600', 'border-gray-300');
                    }
                });
                dietContainer.appendChild(btn);
            });
        }
    }

    function fetchCurrentLocation() {
        const btn = changeLocationBtn;
        const originalText = btn.innerText;
        btn.innerText = 'กำลังหา...';
        btn.classList.add('animate-pulse');

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(function(position) {
                currentLat = position.coords.latitude;
                currentLng = position.coords.longitude;
                
                // Use OpenStreetMap Nominatim API for free reverse geocoding with high zoom (18) for street-level accuracy
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLng}&zoom=18&addressdetails=1`)
                    .then(response => response.json())
                    .then(data => {
                        let locationName = '';
                        if (data && data.address) {
                            const addr = data.address;
                            // Extract meaningful location parts
                            let localArea = addr.suburb || addr.town || addr.city_district || addr.county || addr.city || '';
                            let province = addr.state || addr.province || '';
                            
                            if (localArea === province) {
                                locationName = province;
                            } else if (localArea && province) {
                                locationName = `${localArea}, ${province}`;
                            } else {
                                locationName = localArea || province || addr.village || addr.road || 'ตำแหน่งปัจจุบัน';
                            }
                        } else {
                            locationName = `${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`;
                        }
                        currentLocationName = locationName;
                        locationText.innerText = locationName;
                        btn.innerText = 'เปลี่ยน';
                        btn.classList.remove('animate-pulse');
                    })
                    .catch(error => {
                        console.error('Error fetching location name:', error);
                        currentLocationName = `${currentLat.toFixed(4)}, ${currentLng.toFixed(4)}`;
                        locationText.innerText = currentLocationName;
                        btn.innerText = 'เปลี่ยน';
                        btn.classList.remove('animate-pulse');
                    });
            }, function(error) {
                console.error('Geolocation error:', error);
                locationText.innerText = 'ไม่สามารถระบุตำแหน่งได้';
                btn.innerText = 'เปลี่ยน';
                btn.classList.remove('animate-pulse');
            }, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        } else {
            locationText.innerText = 'อุปกรณ์ไม่รองรับ';
            btn.innerText = 'เปลี่ยน';
            btn.classList.remove('animate-pulse');
        }
    }

    changeLocationBtn.addEventListener('click', fetchCurrentLocation);

    loadSettings();
</script>
</body>
</html>
