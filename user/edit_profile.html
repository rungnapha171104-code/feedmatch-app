<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>แก้ไขโปรไฟล์ - FeedMatch</title>
        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
        <style>
        body {
            font-family: 'Noto Sans Thai', 'Inter', sans-serif;
        }
        .font-heading { font-family: 'Outfit', sans-serif; }
        </style>
    <link rel="icon" type="image/png" href="../assets/images/Logoremovebg.png">
</head>
<body class="min-h-screen bg-gray-50 text-gray-800 flex flex-col">

    <!-- Standard Header -->
    <header class="w-full bg-white shadow-sm px-8 py-4 relative z-20 flex justify-between items-center shrink-0 w-full">
        <!-- Left: Logo -->
        <div class="flex items-center">
            <img src="../assets/images/Logoremovebg.png" alt="FeedMatch Logo" class="h-16 w-auto object-contain">
        </div>

    <!-- Right: Close Button -->
    <a href="../user/profile.html" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-red-100 hover:text-red-600 transition-colors duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
</a>
</header>

<!-- Page Content -->
<main class="w-full max-w-2xl mx-auto px-4 mt-10 pb-20 flex-grow">

    <!-- 2. Page Header -->
    <div class="text-center">
        <h1 class="text-3xl font-bold text-gray-800">แก้ไขโปรไฟล์ ️</h1>
        <p class="text-gray-500 mt-2">อัปเดตข้อมูลส่วนตัวของคุณ</p>
    </div>

<!-- 3. Edit Form Container -->
<div class="bg-white rounded-2xl shadow-sm p-8 mt-8 border border-gray-100">

    <!-- Section 1: Avatar Edit -->
    <div class="flex flex-col items-center">
        <div class="relative mb-2">
            <!-- Large Avatar -->
            <div id="user-avatar" class="w-28 h-28 bg-orange-100 text-orange-600 flex items-center justify-center text-4xl font-bold rounded-full">
                        US
            </div>
        <!-- Edit/Camera Badge -->
        <input type="file" id="avatar-upload" accept="image/*" class="hidden">
        <button type="button" onclick="document.getElementById('avatar-upload').click()" class="absolute bottom-0 right-0 bg-white shadow border border-gray-200 rounded-full p-2 text-gray-600 hover:text-orange-500 transition-colors" title="อัปโหลดรูปภาพใหม่">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z" />
            </svg>
    </button>
</div>
<span onclick="document.getElementById('avatar-upload').click()" class="text-orange-500 font-semibold text-sm hover:underline cursor-pointer">เปลี่ยนรูปโปรไฟล์</span>
</div>

<!-- Section 2: Input Fields -->
<form class="mt-8 space-y-6">
<!-- Section: Account Data -->
<div class="mb-6">
    <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">ข้อมูลบัญชี</h2>
    <div class="space-y-4">
        <!-- Field 1: Display Name -->
        <div>
            <label for="display-name" class="font-bold text-gray-700 text-sm mb-1 block">ชื่อที่แสดง (Display Name)</label>
            <input type="text" id="display-name" value="คุณผู้ใช้งาน" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all text-gray-800">
        </div>

        <!-- Field 2: Email -->
        <div>
            <label for="email" class="font-bold text-gray-700 text-sm mb-1 block">อีเมล (Email)</label>
            <input type="email" id="email" value="กำลังโหลด..." readonly class="w-full border border-gray-300 rounded-lg px-4 py-3 bg-gray-100 text-gray-500 cursor-not-allowed outline-none">
        </div>
    </div>
</div>
</form>

<!-- 4. Action Buttons -->
<div class="mt-10 flex flex-col md:flex-row gap-4">
    <a href="../user/profile.html" class="flex-1 bg-white border-2 border-gray-200 text-gray-600 font-bold py-3 rounded-xl text-center hover:bg-gray-50 transition-colors block">
                    ยกเลิก
    </a>
    <button id="save-btn" class="flex-1 bg-orange-500 text-white font-bold py-3 rounded-xl text-center shadow-md hover:bg-orange-600 transition-all block">
                    บันทึกข้อมูล
    </button>
</div>

</div>
</main>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        // Fetch current user session
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.href = '../index.html';
            return;
        }

        const user = session.user;
        document.getElementById('email').value = user.email;

        // Fetch profile data
        const { data: profile } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', user.id)
            .single();

        let avatarBase64 = null;

        // Fallback defaults: try user_metadata first, then email
        let username = user.user_metadata?.display_name || user.email.split('@')[0];
        let avatarColor = null;

        if (profile) {
            if (profile.username) username = profile.username;
            if (profile.avatar_color) avatarColor = profile.avatar_color;
            if (profile.avatar_url) avatarBase64 = profile.avatar_url;
        }

        document.getElementById('display-name').value = username;
        
        // Set Avatar
        const avatarDiv = document.getElementById('user-avatar');
        if (avatarDiv) {
            if (avatarBase64) {
                avatarDiv.innerHTML = '';
                avatarDiv.style.backgroundImage = `url(${avatarBase64})`;
                avatarDiv.style.backgroundSize = 'cover';
                avatarDiv.style.backgroundPosition = 'center';
            } else {
                const initial = username.charAt(0).toUpperCase();
                avatarDiv.textContent = initial;
                if (avatarColor) {
                    avatarDiv.style.backgroundColor = avatarColor;
                    avatarDiv.style.color = '#fff';
                }
            }
        }

        // Handle Avatar Upload and Resize
        const avatarUpload = document.getElementById('avatar-upload');
        if (avatarUpload) {
            avatarUpload.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxSize = 300;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxSize) {
                                height *= maxSize / width;
                                width = maxSize;
                            }
                        } else {
                            if (height > maxSize) {
                                width *= maxSize / height;
                                height = maxSize;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        avatarBase64 = canvas.toDataURL('image/jpeg', 0.8);
                        
                        // Update UI Preview
                        avatarDiv.textContent = '';
                        avatarDiv.style.backgroundImage = `url(${avatarBase64})`;
                        avatarDiv.style.backgroundSize = 'cover';
                        avatarDiv.style.backgroundPosition = 'center';
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // Save logic
        document.getElementById('save-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            const newName = document.getElementById('display-name').value;
            const btn = e.target;
            btn.textContent = 'กำลังบันทึก...';
            btn.disabled = true;
            
            const payload = {
                id: user.id,
                username: newName
            };

            // Only update avatar if avatarColor doesn't exist yet, or we have a base64
            if (avatarBase64) {
                payload.avatar_url = avatarBase64;
            }
            if (avatarColor) {
                payload.avatar_color = avatarColor;
            }

            const { error } = await supabaseClient
                .from('profiles')
                .upsert(payload, { onConflict: 'id' });

            if (error) {
                alert('เกิดข้อผิดพลาดในการบันทึก: ' + error.message);
                btn.textContent = 'บันทึกข้อมูล';
                btn.disabled = false;
            } else {
                window.location.href = '../user/profile.html';
            }
        });
    });
</script>
</body>
</html>
