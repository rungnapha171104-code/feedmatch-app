<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นำทางไปร้าน - FeedMatch</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Noto Sans Thai', 'Inter', sans-serif; }
        .font-heading { font-family: 'Outfit', sans-serif; }
        
        /* Dashed Line Animation */
        @keyframes dash {
            to { stroke-dashoffset: -24; }
        }
        .animate-dash {
            animation: dash 1s linear infinite;
        }
    </style>
    <link rel="icon" type="image/png" href="../assets/images/Logoremovebg.png">
</head>
<body class="h-screen bg-gray-50 flex flex-col overflow-hidden text-gray-800">

    <!-- Top Navigation Bar -->
    <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center z-50 w-full shrink-0">
        <!-- Left: Logo -->
        <div class="flex items-center">
            <img src="../assets/images/Logoremovebg.png" alt="FeedMatch Logo" class="h-16 w-auto object-contain">
        </div>
        
        <!-- Right: Back Button -->
        <a id="back-btn" href="../room/main.html" class="flex items-center gap-2 text-gray-500 hover:text-gray-900 font-medium transition-colors bg-gray-50 hover:bg-gray-100 px-4 py-2.5 rounded-full">
            <i class="ph ph-house text-xl"></i>
            หน้าหลัก
        </a>
    </header>

    <!-- Main Content Container (Responsive Web & Mobile) -->
    <main class="max-w-7xl mx-auto w-full px-6 py-8 flex-grow flex flex-col justify-center items-center">
        
        <!-- Two-column layout on Desktop, Stacked on Mobile -->
        <div class="flex flex-col md:flex-row w-full gap-6 md:gap-10 h-full md:h-[80vh] max-h-[850px] items-stretch">
            
            <!-- The Image Section (Left/Top) -->
            <section class="w-full md:w-1/2 h-40 sm:h-64 md:h-full bg-gray-100 rounded-3xl md:rounded-[2rem] shadow-md overflow-hidden relative border border-gray-100 flex items-center justify-center shrink-0 md:shrink">
                <!-- Main Image -->
                <img id="main-restaurant-image" src="" alt="Restaurant Image" class="w-full h-full object-cover hidden">
                <!-- Fallback Icon if no image -->
                <i id="image-fallback-icon" class="ph ph-storefront text-6xl md:text-8xl text-gray-300"></i>
                
                <!-- Dark gradient overlay for a premium look (optional) -->
                <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-black/5 to-transparent pointer-events-none"></div>
            </section>

            <!-- Restaurant Details & Actions Section (Right/Bottom) -->
            <section class="w-full md:w-1/2 flex flex-col justify-between bg-white p-6 md:p-12 lg:p-16 rounded-3xl md:rounded-[2rem] shadow-lg border border-gray-100 shrink-0 md:shrink h-auto md:h-full">
                
                <!-- Text Info & Badges -->
                <div class="flex flex-col items-center justify-center text-center w-full gap-2 sm:gap-5 flex-grow my-auto">
                    <h1 id="restaurant-name" class="text-3xl md:text-5xl lg:text-6xl font-bold text-gray-900 leading-snug line-clamp-3">กำลังโหลด...</h1>
                    
                    <!-- Information Badge -->
                    <div class="flex items-center gap-3 text-sm md:text-lg lg:text-xl text-gray-600 font-medium bg-orange-50 px-6 py-3 rounded-full border border-orange-100 shadow-sm mt-2">
                        <i class="ph-fill ph-map-pin text-orange-500 text-2xl"></i>
                        <span class="text-orange-700">กดเริ่มนำทาง เพื่อดูเส้นทาง</span>
                    </div>
                </div>
                
                <div class="flex flex-col w-full mt-8 shrink-0">
                    <hr class="border-gray-100 w-full mb-6 md:mb-8">

                    <!-- Action Buttons -->
                    <div class="flex flex-row w-full gap-4 md:gap-6">
                        <!-- Secondary Button -->
                        <a id="back-liked-btn" href="#" class="flex-1 bg-gray-50 border border-gray-100 text-gray-700 font-bold text-sm md:text-lg lg:text-xl py-4 md:py-6 rounded-2xl md:rounded-3xl hover:bg-gray-100 transition-all flex flex-col items-center justify-center gap-1 shadow-sm">
                            <i class="ph-fill ph-heart text-2xl md:text-3xl text-rose-500"></i>
                            <span>ร้านที่ถูกใจ</span>
                        </a>
                        
                        <!-- Primary Button -->
                        <a id="nav-btn" href="#" target="_blank" rel="noopener noreferrer" class="flex-1 bg-orange-500 text-white font-bold text-sm md:text-lg lg:text-xl py-4 md:py-6 rounded-2xl md:rounded-3xl shadow-md hover:bg-orange-600 hover:-translate-y-0.5 transition-all flex flex-col items-center justify-center gap-1">
                            <i class="ph-fill ph-navigation-arrow text-2xl md:text-3xl"></i>
                            <span>เริ่มนำทาง</span>
                        </a>
                    </div>
                </div>
            </section>
        </div>

    </main>

    <!-- Supabase & Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const restaurantId = urlParams.get('id');
        const roomId = urlParams.get('room_id');

        // Setup back button (Header) to go to main or history
        const backBtn = document.getElementById('back-btn');
        if (backBtn) {
            const from = urlParams.get('from');
            if (from === 'history') {
                backBtn.href = '../user/history.html';
                backBtn.innerHTML = '<i class="ph ph-clock-counter-clockwise text-xl"></i> ประวัติ';
            } else {
                backBtn.href = '#';
                backBtn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    if (roomId) {
                        await supabaseClient.from('rooms').update({ status: 'completed' }).eq('id', roomId);
                    }
                    window.location.href = '../room/main.html';
                });
            }
        }

        // Setup liked list back button
        const backLikedBtn = document.getElementById('back-liked-btn');
        if (backLikedBtn && roomId) {
            backLikedBtn.href = `../play/liked_list.html?id=${roomId}`;
        }

        async function init() {
            if (!restaurantId) {
                document.getElementById('restaurant-name').textContent = 'ข้อผิดพลาด: ไม่พบรหัสร้านอาหาร (ID)';
                return;
            }

            const { data: restaurant, error } = await supabaseClient
                .from('restaurants')
                .select('*')
                .eq('id', restaurantId)
                .single();
            
            if (error || !restaurant) {
                console.error("Error fetching restaurant:", error);
                document.getElementById('restaurant-name').textContent = `ข้อผิดพลาด: ${error ? error.message : 'ไม่พบข้อมูลร้าน'}`;
                return;
            }

            // Update UI with basic info
            document.getElementById('restaurant-name').textContent = restaurant.name;

            const mainImgElement = document.getElementById('main-restaurant-image');
            const fallbackIcon = document.getElementById('image-fallback-icon');
            if (restaurant.image_url) {
                mainImgElement.src = restaurant.image_url;
                mainImgElement.classList.remove('hidden');
                if (fallbackIcon) fallbackIcon.classList.add('hidden');
            }
            
            // Extract custom map link if they added one in Supabase (check common column names)
            const customMapLink = restaurant.map_url || restaurant.map_link || restaurant.google_map_url || restaurant.google_maps_url || restaurant.link || restaurant.url;

            // Set up start navigation button
            const navBtn = document.getElementById('nav-btn');
            if (customMapLink) {
                navBtn.href = customMapLink;
            } else if (restaurant.lat && restaurant.lng) {
                // Fallback to raw coordinates
                navBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${restaurant.lat},${restaurant.lng}`;
            }
        }

        init();
    </script>
</body>
</html>
